<div appLinkInterceptor>
  <app-navbar></app-navbar>

  <main class="main">
    <!--/* ROUTER OUTLET */-->
    <router-outlet></router-outlet>
  </main>

  <!-- Bouncing logos component -->
  @if (isLesson()) {
    <details class="exploration" (toggle)="toggleExploration($event)">
      <summary class="exploration__summary">Esplorazione libera: mostra gli argomenti casuali</summary>
      @if (explorationOpen()) { <app-bouncing-logo /> }
    </details>
  } @else { <app-bouncing-logo /> }
</div>

<!-- Modal for external/internal links -->
<app-link-modal></app-link-modal>
