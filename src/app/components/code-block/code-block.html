<div class="code-block-container">
  <div class="code-block-header">
    <span class="code-block-language">{{ language }}</span>
    <button
      type="button"
      class="code-block-copy-btn"
      [attr.aria-label]="copied() ? 'Codice copiato' : 'Copia codice'"
      (click)="copyCode()"
      [class.copied]="copied()"
    >
      @if (copied()) {
        <app-icon name="check-circle" />
        <span>Copiato!</span>
      } @else {
        <app-icon name="copy" />
        <span>Copia</span>
      }
    </button>
  </div>
  @if (copyError()) { <p class="code-block-copy-error" role="status">Copia non disponibile. Seleziona il codice e copialo con la tastiera.</p> }
  <div class="code-block-content" tabindex="0" role="region" aria-label="Codice dell’esempio">
    <pre><code [innerHTML]="highlightedCode"></code></pre>
  </div>
</div>
