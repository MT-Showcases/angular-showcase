<!-- One example has one editor and preview; switching retains source drafts. -->
<nav class="examples__choices" aria-label="Scegli un esempio">
  @for (example of examples(); track example.id) {
    <button
      matButton="outlined"
      type="button"
      [attr.aria-pressed]="active()?.id === example.id"
      (click)="selectedId.set(example.id)"
    >{{ example.label }}</button>
  }
</nav>
@if (active(); as selected) {
  @for (example of [selected]; track example.id) {
    <p class="examples__prompt"><strong>Prova:</strong> {{ example.prompt }}</p>
    <app-angular-playground
      [title]="example.title"
      [initial]="example.sources"
      [draft]="drafts.get(example.id)"
      (sourceChange)="remember(example.id, $event)"
    />
    <p class="examples__takeaway">{{ example.takeaway }}</p>
  }
}
<p class="examples__hint">Il codice modificato resta salvato finché rimani nella pagina. Cambiando esempio, la demo riparte.</p>
