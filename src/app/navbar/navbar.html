<nav class="nav" aria-label="Navigazione principale">
  <!-- Main Items -->
  @for (item of mainItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: !!item.exact }"
      class="nav-link"
      [attr.aria-label]="item.label"
      (click)="closeDropdown()"
    >
      <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  }

  <!-- Dropdown Groups -->
  @for (group of groups; track group.label; let index = $index) {
    <div class="nav-dropdown" [class.open]="openDropdown() === group.label">
      <button
        class="nav-link dropdown-trigger"
        [attr.aria-expanded]="openDropdown() === group.label"
        [attr.aria-controls]="'nav-group-' + index"
        [class.active]="isGroupActive(group)"
        (click)="toggleDropdown(group.label)"
        type="button"
      >
        <span class="nav-group-icons" aria-hidden="true">
          <mat-icon class="nav-icon">{{ group.icon }}</mat-icon>
          <mat-icon class="dropdown-arrow">expand_more</mat-icon>
        </span>
        <span class="nav-label">{{ group.label }}</span>
      </button>

      <div class="dropdown-menu" [id]="'nav-group-' + index">
        @for (item of group.items; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: true }"
            class="dropdown-item"
            (click)="closeDropdown()"
          >
            <mat-icon class="dropdown-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
            <span class="dropdown-label">{{ item.label }}</span>
          </a>
        }
      </div>
    </div>
  }
</nav>
